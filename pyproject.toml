[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dataset-quality-checker"
version = "0.1.0"
description = "Validate computer vision datasets (YOLO format) before model training."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Sujal Krishna Das" }]
keywords = ["computer-vision", "dataset", "validation", "yolo", "data-quality"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = ["Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dqc = "dataset_quality_checker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
